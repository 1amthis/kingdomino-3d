name: Full Neural MCTS End-to-End Training and Arena

on:
  push:
    branches:
      - experiment/full-neural-mcts
    paths:
      - '.github/workflows/full-neural.yml'

permissions:
  contents: read

jobs:
  collect:
    name: Full legal-action self-play ${{ matrix.split }} shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { split: train, shard: 0, first: 250000, games: 16 }
          - { split: train, shard: 1, first: 250016, games: 16 }
          - { split: train, shard: 2, first: 250032, games: 16 }
          - { split: train, shard: 3, first: 250048, games: 16 }
          - { split: train, shard: 4, first: 250064, games: 16 }
          - { split: train, shard: 5, first: 250080, games: 16 }
          - { split: train, shard: 6, first: 250096, games: 16 }
          - { split: train, shard: 7, first: 250112, games: 16 }
          - { split: valid, shard: 0, first: 920000, games: 16 }
          - { split: valid, shard: 1, first: 920016, games: 16 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: "MCTS self-play: all placement and draft visit distributions"
        env:
          FIRST: ${{ matrix.first }}
          GAMES: ${{ matrix.games }}
        run: |
          node scripts/full-neural/collect.js --first "$FIRST" --games "$GAMES" --sims 192 --place-sims 96 --out shard.json
      - uses: actions/upload-artifact@v4
        with:
          name: full-data-${{ matrix.split }}-${{ matrix.shard }}
          path: shard.json
          retention-days: 30

  train:
    name: Train spatial residual placement + draft policy/value model
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: full-data-*
          path: data
      - name: Install PyTorch CPU and numpy
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.3
          python -m pip install torch==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Train with game-level holdout, D4 augmentation, and all-action masks
        run: |
          python scripts/full-neural/train.py --data data --out full-model.json --epochs 12 --batch 48 --lr 0.0007
          python -c 'import json;d=json.load(open("full-model.report.json"));assert d["trainExamples"]>2000 and d["validExamples"]>400'
          python -c 'import json,os;d=json.load(open("full-model.report.json"));open(os.environ["GITHUB_STEP_SUMMARY"],"a").write("## Full residual training\n\nExamples train/valid: "+str(d["trainExamples"])+" / "+str(d["validExamples"])+"\n\nBest validation: "+str(d["validation"])+"\n")'
      - uses: actions/upload-artifact@v4
        with:
          name: full-neural-trained-weights
          path: |
            full-model.json
            full-model.report.json
          retention-days: 30

  arena:
    name: Full network ${{ matrix.mode }} ${{ matrix.rules }} shard ${{ matrix.shard }}
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        mode: [policy, value]
        rules: [plain, middle, harmony, both]
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: full-neural-trained-weights
          path: model
      - name: Seat-swapped full legal-action neural vs unchanged Expert
        env:
          MODE: ${{ matrix.mode }}
          RULES: ${{ matrix.rules }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          case "$RULES" in
            plain) RID=0; MID=0; HAR=0 ;;
            middle) RID=1; MID=1; HAR=0 ;;
            harmony) RID=2; MID=0; HAR=1 ;;
            both) RID=3; MID=1; HAR=1 ;;
            *) exit 1 ;;
          esac
          SEED=$((310000 + RID * 1000 + SHARD * 25))
          node scripts/full-neural/bench.js --model model/full-model.json --mode "$MODE" --leaf-every 128 --first "$SEED" --deals 25 --sims 3000 --ms 1500 --middle "$MID" --harmony "$HAR" --threads 2 --out result.json
      - uses: actions/upload-artifact@v4
        with:
          name: full-${{ matrix.mode }}-${{ matrix.rules }}-${{ matrix.shard }}
          path: result.json
          retention-days: 30

  summary:
    name: Aggregate full neural real-budget results
    needs: arena
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: full-*-*-*
          path: arena
      - name: Verify 800 games and paired error bars
        run: |
          node scripts/full-neural/aggregate.js arena full-arena.json
          cat full-arena.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: full-neural-arena-summary
          path: |
            full-arena.json
            full-arena.md
          retention-days: 30

