name: Learned Eval 300-Deal Benchmark

on:
  push:
    branches:
      - experiment/fast-learned-eval

permissions:
  contents: read

jobs:
  benchmark:
    name: Shard ${{ matrix.shard }}/5
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run 50 paired deals (100 games)
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          SEED=$((24000 + SHARD * 50))
          node scripts/bench-learned.js --mode tree --deals 50 --sims 2000 --ms 55 --threads 4 --seed "$SEED" > result.json
          cat result.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-shard-${{ matrix.shard }}
          path: result.json
          retention-days: 30

  aggregate:
    name: Aggregate all 300 deals
    needs: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: bench-shard-*
          path: shards
      - name: Produce complete paired report
        run: |
          node scripts/aggregate-learned.js shards bench-300.json
          node -e "const r=require('./bench-300.json');if(r.pairedDeals !== 300 || r.games !== 600) process.exit(1)"
          cat bench-300.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-300-result
          path: |
            bench-300.json
            bench-300.md
          retention-days: 30
