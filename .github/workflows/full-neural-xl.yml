    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: full-neural-v2-weights
          path: teacher
          run-id: 38121490568
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate compressed MCTS-policy replay, both actions and actual outcomes
        env:
          FIRST: ${{ matrix.first }}
          GAMES: ${{ matrix.games }}
        run: |
          set -euo pipefail
          node scripts/full-neural/collect.js --first "$FIRST" --games "$GAMES" --sims 1024 --place-sims 512 --model teacher/full-model-v2.json --leaf-every 0 --out shard.json.gz
          test -s shard.json.gz
      - uses: actions/upload-artifact@v4
        with:
          name: xl-data-${{ matrix.split }}-${{ matrix.shard }}
          path: shard.json.gz
          retention-days: 45

  train:
    name: Train 48-channel 4-block residual policy/value on 5344 games
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: full-data-*
          path: data/initial
          run-id: 38121247728
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: full-scale-*
          path: data/previous
          run-id: 38121490568
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: xl-data-*
          path: data/xl
      - name: Install optimized CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.3
          python -m pip install torch==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Train max-size accessible 48x4 residual network on complete replay
        run: |
          python scripts/full-neural/train.py --data data --out xl-model.json --channels 48 --blocks 4 --aux-width 64 --epochs 24 --max-train-minutes 290 --batch 64 --lr 0.00045 --seed 509
          python -c 'import json;d=json.load(open("xl-model.report.json"));assert d["games"]==5344 and d["trainExamples"]>140000 and d["validExamples"]>16000'
          python -c 'import json,os;d=json.load(open("xl-model.report.json"));open(os.environ["GITHUB_STEP_SUMMARY"],"a").write("## XL result\n\n"+json.dumps({k:d[k] for k in ["games","trainExamples","validExamples","parameterCount","bestEpoch","validation","trainingElapsedMinutes"]})+"\n")'
      - uses: actions/upload-artifact@v4
        with:
          name: xl-trained-checkpoint
          path: |
            xl-model.json
            xl-model.report.json
          retention-days: 90

  arena:
    name: XL ${{ matrix.case }} ${{ matrix.rules }} shard ${{ matrix.shard }}
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        case: [policy-original, policy-uncapped, value-original]
        rules: [plain, middle, harmony, both]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: xl-trained-checkpoint
          path: model
      - name: Independent paired Expert comparison, frozen checkpoint
        env:
          CASE: ${{ matrix.case }}
          RULES: ${{ matrix.rules }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          case "$RULES" in
            plain) RID=0; MID=0; HAR=0 ;;
            middle) RID=1; MID=1; HAR=0 ;;
            harmony) RID=2; MID=0; HAR=1 ;;
            both) RID=3; MID=1; HAR=1 ;;
            *) exit 1 ;;
          esac
          MODE="${CASE%%-*}"
          BASELINE="${CASE#*-}"
          SEED=$((450000 + RID * 2000 + SHARD * 25))
          node scripts/full-neural/bench.js --model model/xl-model.json --mode "$MODE" --baseline "$BASELINE" --leaf-every 512 --first "$SEED" --deals 25 --sims 3000 --ms 1500 --middle "$MID" --harmony "$HAR" --threads 2 --out result.json
          test -s result.json
      - uses: actions/upload-artifact@v4
        with:
          name: xl-arena-${{ matrix.case }}-${{ matrix.rules }}-${{ matrix.shard }}
          path: result.json
          retention-days: 45

  summarize:
    name: Aggregate 4800 completely played XL arena games
    needs: arena
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: xl-arena-*
          path: arena
      - name: Verify 96 shards and calculate within-pair uncertainty
        run: |
          node scripts/full-neural/aggregate-xl.js arena xl-arena-results.json
          cat xl-arena-results.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: xl-final-arena-and-confidence
          path: |
            xl-arena-results.json
            xl-arena-results.md
          retention-days: 90
