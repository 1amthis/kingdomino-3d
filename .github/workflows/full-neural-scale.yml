name: Full Spatial Neural MCTS Scaled Self-Play

on:
  push:
    branches:
      - experiment/full-neural-mcts
    paths:
      - '.github/workflows/full-neural-scale.yml'

permissions:
  contents: read
  actions: read

jobs:
  collect:
    name: Neural-guided all-action self-play ${{ matrix.split }} shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { split: train, shard: 0, first: 270000, games: 24 }
          - { split: train, shard: 1, first: 270024, games: 24 }
          - { split: train, shard: 2, first: 270048, games: 24 }
          - { split: train, shard: 3, first: 270072, games: 24 }
          - { split: train, shard: 4, first: 270096, games: 24 }
          - { split: train, shard: 5, first: 270120, games: 24 }
          - { split: train, shard: 6, first: 270144, games: 24 }
          - { split: train, shard: 7, first: 270168, games: 24 }
          - { split: train, shard: 8, first: 270192, games: 24 }
          - { split: train, shard: 9, first: 270216, games: 24 }
          - { split: train, shard: 10, first: 270240, games: 24 }
          - { split: train, shard: 11, first: 270264, games: 24 }
          - { split: train, shard: 12, first: 270288, games: 24 }
          - { split: train, shard: 13, first: 270312, games: 24 }
          - { split: train, shard: 14, first: 270336, games: 24 }
          - { split: train, shard: 15, first: 270360, games: 24 }
          - { split: train, shard: 16, first: 270384, games: 24 }
          - { split: train, shard: 17, first: 270408, games: 24 }
          - { split: train, shard: 18, first: 270432, games: 24 }
          - { split: train, shard: 19, first: 270456, games: 24 }
          - { split: valid, shard: 0, first: 940000, games: 24 }
          - { split: valid, shard: 1, first: 940024, games: 24 }
          - { split: valid, shard: 2, first: 940048, games: 24 }
          - { split: valid, shard: 3, first: 940072, games: 24 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: full-neural-trained-weights
          path: prior
          run-id: 38121247728
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Improved and mixed-policy MCTS trajectories
        env:
          FIRST: ${{ matrix.first }}
          GAMES: ${{ matrix.games }}
        run: |
          node scripts/full-neural/collect.js --first "$FIRST" --games "$GAMES" --sims 384 --place-sims 192 --model prior/full-model.json --leaf-every 0 --out shard.json
      - uses: actions/upload-artifact@v4
        with:
          name: full-scale-${{ matrix.split }}-${{ matrix.shard }}
          path: shard.json
          retention-days: 30

  train:
    name: Fine-tune residual CNN from 608 whole-game trajectories
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: full-data-*
          path: data/initial
          run-id: 38121247728
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: full-scale-*
          path: data/scaled
      - uses: actions/download-artifact@v4
        with:
          name: full-neural-trained-weights
          path: prior
          run-id: 38121247728
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.3
          python -m pip install torch==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Replay-buffer residual policy and value training
        run: |
          python scripts/full-neural/train.py --data data --out full-model-v2.json --init prior/full-model.json --epochs 16 --batch 64 --lr 0.00035 --seed 508
          python -c 'import json;d=json.load(open("full-model-v2.report.json"));assert d["games"]==736 and d["trainExamples"]>15000 and d["validExamples"]>3000'
          python -c 'import json,os;d=json.load(open("full-model-v2.report.json"));open(os.environ["GITHUB_STEP_SUMMARY"],"a").write("## Full V2 training\n\n"+json.dumps({k:d[k] for k in ["games","trainExamples","validExamples","validation"]})+"\n")'
      - uses: actions/upload-artifact@v4
        with:
          name: full-neural-v2-weights
          path: |
            full-model-v2.json
            full-model-v2.report.json
          retention-days: 30

  arena:
    name: V2 policy + value ${{ matrix.mode }} ${{ matrix.rules }} shard ${{ matrix.shard }}
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        mode: [policy, value]
        rules: [plain, middle, harmony, both]
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: full-neural-v2-weights
          path: model
      - name: Frozen V2 against original Expert at exact wall time
        env:
          MODE: ${{ matrix.mode }}
          RULES: ${{ matrix.rules }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          case "$RULES" in
            plain) RID=0; MID=0; HAR=0 ;;
            middle) RID=1; MID=1; HAR=0 ;;
            harmony) RID=2; MID=0; HAR=1 ;;
            both) RID=3; MID=1; HAR=1 ;;
            *) exit 1 ;;
          esac
          SEED=$((320000 + RID * 1000 + SHARD * 25))
          node scripts/full-neural/bench.js --model model/full-model-v2.json --mode "$MODE" --leaf-every 128 --first "$SEED" --deals 25 --sims 3000 --ms 1500 --middle "$MID" --harmony "$HAR" --threads 2 --out result.json
      - uses: actions/upload-artifact@v4
        with:
          name: full-v2-${{ matrix.mode }}-${{ matrix.rules }}-${{ matrix.shard }}
          path: result.json
          retention-days: 30

  summary:
    name: Aggregate full-neural V2 independent benchmark
    needs: arena
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: full-v2-*-*-*
          path: arena
      - name: Paired confidence intervals and safety checks
        run: |
          node scripts/full-neural/aggregate.js arena full-v2-arena.json
          cat full-v2-arena.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: full-neural-v2-arena
          path: |
            full-v2-arena.json
            full-v2-arena.md
          retention-days: 30
